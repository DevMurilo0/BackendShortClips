name: BackendShortClips — Python gateway tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDKs
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Validate Python API
        run: |
          python -m py_compile api/index.py api/policy.py api/sandbox_engine.py worker/runner.py
          python -m unittest discover -s tests -v
      - name: Validate signed download function
        run: node --check api/download.js
      - name: Validate Vercel configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('vercel.json').read_text())
          assert config['version']==2
          assert 'api/index.py' in config['functions']
          assert not config.get('crons')
          assert not config.get('schedules')
          assert any(r['source']=='/api/jobs/:job_id' for r in config['rewrites'])
          assert config['rewrites'][0]['destination']=='/api/download.js'
          print('Vercel configuration: OK')
          PY
